<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="48" fill="#0a0f0a"/>
  <!-- Outer glow ring -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#4ade80" stroke-width="1" opacity="0.3"/>
  <!-- Background glow -->
  <ellipse cx="50" cy="35" rx="18" ry="20" fill="#4ade80" filter="url(#blur)" opacity="0.4"/>
  <!-- Worm body segments -->
  <g filter="url(#softglow)">
    <!-- Glowing head/lantern -->
    <circle cx="50" cy="30" r="14" fill="url(#glow)"/>
    <circle cx="50" cy="30" r="10" fill="#86efac"/>
    <!-- Body segments -->
    <ellipse cx="50" cy="48" rx="12" ry="10" fill="#1a2e1a"/>
    <ellipse cx="50" cy="62" rx="10" ry="8" fill="#1a2e1a"/>
    <ellipse cx="50" cy="74" rx="8" ry="6" fill="#1a2e1a"/>
    <ellipse cx="50" cy="84" rx="6" ry="5" fill="#1a2e1a"/>
    <!-- Segment highlights -->
    <ellipse cx="50" cy="48" rx="12" ry="10" fill="none" stroke="#4ade80" stroke-width="1" opacity="0.5"/>
    <ellipse cx="50" cy="62" rx="10" ry="8" fill="none" stroke="#4ade80" stroke-width="1" opacity="0.4"/>
    <ellipse cx="50" cy="74" rx="8" ry="6" fill="none" stroke="#4ade80" stroke-width="1" opacity="0.3"/>
  </g>
  <!-- Eyes on lantern -->
  <circle cx="45" cy="28" r="2" fill="#0a0f0a"/>
  <circle cx="55" cy="28" r="2" fill="#0a0f0a"/>
</svg>
